<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Serial Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22c55e;
    --accent-dark: #16a34a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #ef4444;
    --warn: #f59e0b;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .brand-logo {
    flex: none;
    display: block;
  }
  header h1 {
    margin: 0;
    font-size: 1.8rem;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
  }
  #readerWrap {
    display: none;
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
  }
  #readerWrap.visible { display: block; }
  #reader {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    min-height: 60px;
  }
  .scan-line {
    position: absolute;
    left: 8%;
    right: 8%;
    top: 50%;
    height: 2px;
    background: #ef4444;
    box-shadow: 0 0 4px 1px rgba(239, 68, 68, 0.8);
    pointer-events: none;
    z-index: 5;
    display: none;
  }
  .scan-line.active { display: block; }
  .focus-ripple {
    position: absolute;
    width: 56px;
    height: 56px;
    margin-left: -28px;
    margin-top: -28px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 6;
    opacity: 0;
  }
  .focus-ripple.pulse {
    animation: focusPulse 0.5s ease-out;
  }
  @keyframes focusPulse {
    0% { opacity: 1; transform: scale(1.2); }
    100% { opacity: 0; transform: scale(0.85); }
  }
  .camera-controls {
    margin-top: 10px;
    display: none;
  }
  .camera-controls.visible { display: block; }
  .control-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .control-row label {
    margin-bottom: 0;
    flex: none;
    width: 55px;
  }
  .control-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .zoom-value {
    width: 34px;
    text-align: right;
    font-size: 0.8rem;
    color: var(--muted);
    flex: none;
  }
  #zoom2xBtn, #torchBtn {
    flex: none;
    min-width: unset;
    padding: 8px 12px;
    font-size: 0.8rem;
  }
  #torchBtn.on { background: var(--warn); color: #241a04; }
  .capability-note {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    min-width: 100px;
  }
  .btn-primary { background: var(--accent); color: #04240f; }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-secondary { background: #334155; color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.5; cursor: default; }

  #status {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 20px;
  }
  #status.ok { color: var(--accent); }
  #status.dup { color: var(--warn); }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }
  .label-input {
    width: 100%;
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.8rem;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 1.1rem;
    padding: 0 6px;
    flex: none;
    min-width: unset;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 20px 0;
    font-size: 0.85rem;
  }
  .count-badge {
    display: inline-block;
    background: var(--accent);
    color: #04240f;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-left: 6px;
  }
  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.8rem;
  }
  details p, details ul {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.4;
  }
  #reader video { object-fit: cover; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="brand-logo" width="52" height="52" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Serial Scanner logo">
      <path d="M6 18 V8 a2 2 0 0 1 2-2 H18" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
      <path d="M46 6 H56 a2 2 0 0 1 2 2 V18" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
      <path d="M6 46 V56 a2 2 0 0 0 2 2 H18" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
      <path d="M58 46 V56 a2 2 0 0 1-2 2 H46" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
      <g fill="#e2e8f0">
        <rect x="18" y="21" width="2.5" height="22"/>
        <rect x="23" y="21" width="4" height="22"/>
        <rect x="29" y="21" width="2" height="22"/>
        <rect x="33" y="21" width="3" height="22"/>
        <rect x="38.5" y="21" width="2" height="22"/>
        <rect x="42" y="21" width="4" height="22"/>
      </g>
      <line x1="10" y1="32" x2="54" y2="32" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <h1>Serial Scanner</h1>
  </div>
</header>

<main>

  <div class="card">
    <label for="sessionLabel">Batch / location label (optional, applied to new scans)</label>
    <input type="text" id="sessionLabel" placeholder="e.g. Warehouse A - Rack 3">
  </div>

  <div class="card">
    <div id="readerWrap">
      <div id="reader"></div>
      <div class="scan-line" id="scanLine"></div>
      <div class="focus-ripple" id="focusRipple"></div>
    </div>
    <div class="btn-row">
      <button id="startBtn" class="btn-primary">Scan</button>
      <button id="stopBtn" class="btn-secondary" style="display:none;">Stop Scanning</button>
    </div>
    <div class="camera-controls" id="cameraControls">
      <div class="control-row" id="zoomRow" style="display:none;">
        <label for="zoomSlider">Zoom</label>
        <input type="range" id="zoomSlider" min="1" max="1" step="0.1" value="1">
        <span class="zoom-value" id="zoomValue">1x</span>
        <button id="zoom2xBtn" class="btn-outline">2x</button>
      </div>
      <div class="control-row" id="torchRow" style="display:none;">
        <button id="torchBtn" class="btn-outline">Flash off</button>
      </div>
      <div class="capability-note" id="focusNote"></div>
    </div>
    <div id="status"></div>
  </div>

  <div class="card">
    <label for="manualInput">Manual entry (if a barcode won't scan)</label>
    <div style="display:flex; gap:8px;">
      <input type="text" id="manualInput" placeholder="Type serial number">
      <button id="manualAddBtn" class="btn-outline" style="flex: none; min-width: 70px;">Add</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <strong>Captured list <span class="count-badge" id="countBadge">0</span></strong>
    </div>
    <div id="listContainer">
      <div class="empty-state">No items scanned yet</div>
    </div>
    <div class="btn-row">
      <button id="exportBtn" class="btn-primary">Export CSV</button>
      <button id="clearBtn" class="btn-danger">Clear All</button>
    </div>
  </div>

</main>

<script>
(function () {
  const STORAGE_KEY = "serialScannerItems";
  let items = [];
  let html5QrCode = null;
  let scanning = false;
  let scanLocked = false;

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusEl = document.getElementById("status");
  const listContainer = document.getElementById("listContainer");
  const countBadge = document.getElementById("countBadge");
  const manualInput = document.getElementById("manualInput");
  const manualAddBtn = document.getElementById("manualAddBtn");
  const exportBtn = document.getElementById("exportBtn");
  const clearBtn = document.getElementById("clearBtn");
  const sessionLabelInput = document.getElementById("sessionLabel");
  const readerWrap = document.getElementById("readerWrap");
  const scanLine = document.getElementById("scanLine");
  const focusRipple = document.getElementById("focusRipple");
  const cameraControls = document.getElementById("cameraControls");
  const zoomRow = document.getElementById("zoomRow");
  const zoomSlider = document.getElementById("zoomSlider");
  const zoomValue = document.getElementById("zoomValue");
  const zoom2xBtn = document.getElementById("zoom2xBtn");
  const torchRow = document.getElementById("torchRow");
  const torchBtn = document.getElementById("torchBtn");
  const focusNote = document.getElementById("focusNote");

  let torchOn = false;
  let focusCapable = false;

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
    } catch (e) {
      items = [];
    }
  }

  function saveItems() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch (e) { /* storage unavailable, continue in-memory */ }
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) { /* audio not available */ }
  }

  function vibrate() {
    if (navigator.vibrate) navigator.vibrate(80);
  }

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || "";
  }

  function isDuplicate(code) {
    return items.some(it => it.code === code);
  }

  function addItem(code, format) {
    if (isDuplicate(code)) {
      setStatus("Already in the list, skipped: " + code, "dup");
      return false;
    }
    const now = new Date();
    const entry = {
      code: code,
      format: format || "manual",
      label: sessionLabelInput.value.trim(),
      time: now.toISOString(),
      timeDisplay: now.toLocaleString()
    };
    items.unshift(entry);
    saveItems();
    render();
    setStatus("Added: " + code, "ok");
    return true;
  }

  function removeItem(index) {
    items.splice(index, 1);
    saveItems();
    render();
  }

  function render() {
    countBadge.textContent = items.length;
    if (items.length === 0) {
      listContainer.innerHTML = '<div class="empty-state">No items scanned yet</div>';
      return;
    }
    let html = '<table><thead><tr><th>#</th><th>Code</th><th>Label</th><th>Time</th><th></th></tr></thead><tbody>';
    items.forEach((it, idx) => {
      html += `<tr>
        <td>${items.length - idx}</td>
        <td>${escapeHtml(it.code)}</td>
        <td><input type="text" class="label-input" data-idx="${idx}" value="${escapeHtml(it.label || '')}" placeholder="Add name"></td>
        <td>${escapeHtml(it.timeDisplay)}</td>
        <td><button class="del-btn" data-idx="${idx}" title="Delete">&times;</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    listContainer.innerHTML = html;
    listContainer.querySelectorAll(".label-input").forEach(inp => {
      inp.addEventListener("input", () => {
        const idx = parseInt(inp.getAttribute("data-idx"), 10);
        if (items[idx]) {
          items[idx].label = inp.value;
          saveItems();
        }
      });
    });
    listContainer.querySelectorAll(".del-btn").forEach(btn => {
      btn.addEventListener("click", () => removeItem(parseInt(btn.getAttribute("data-idx"), 10)));
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[s]));
  }

  async function onScanSuccess(decodedText, decodedResult) {
    if (scanLocked) return; // already handling a scan / closing the camera
    scanLocked = true;
    const format = (decodedResult && decodedResult.result && decodedResult.result.format &&
      decodedResult.result.format.formatName) || "barcode";
    beep();
    vibrate();
    addItem(decodedText, format);
    await stopScanning(/* silent = */ true);
    scanLocked = false;
  }

  function onScanFailure() {
    // called continuously while no code is in frame; ignore
  }

  async function startScanning() {
    if (scanning) return;
    setStatus("Starting camera…");
    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 150 } };
    // Show the camera container BEFORE starting the camera. html5-qrcode measures
    // the container's size when it attaches the video feed — if the container is
    // still display:none at that moment, the video ends up with no usable size
    // (the collapsed "thin black bar" bug).
    readerWrap.classList.add("visible");
    startBtn.style.display = "none";
    stopBtn.style.display = "";
    try {
      await html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanFailure
      );
      scanning = true;
      scanLine.classList.add("active");
      setStatus("Camera active — point at a barcode", "ok");
      setupCameraControls();
    } catch (err) {
      // Revert the UI back to idle since the camera failed to start.
      readerWrap.classList.remove("visible");
      startBtn.style.display = "";
      stopBtn.style.display = "none";
      setStatus("Could not start camera: " + err + " (try manual entry, or open this page over HTTPS)", "dup");
    }
  }

  async function stopScanning(silent) {
    if (!scanning || !html5QrCode) return;
    try {
      await html5QrCode.stop();
      await html5QrCode.clear();
    } catch (e) { /* ignore */ }
    scanning = false;
    readerWrap.classList.remove("visible");
    startBtn.style.display = "";
    stopBtn.style.display = "none";
    scanLine.classList.remove("active");
    cameraControls.classList.remove("visible");
    zoomRow.style.display = "none";
    torchRow.style.display = "none";
    focusNote.textContent = "";
    torchOn = false;
    focusCapable = false;
    if (!silent) setStatus("Camera stopped");
  }

  function setupCameraControls() {
    cameraControls.classList.add("visible");
    let caps;
    try {
      caps = html5QrCode.getRunningTrackCameraCapabilities();
    } catch (e) {
      focusNote.textContent = "This browser doesn't expose zoom/flash/focus controls.";
      return;
    }

    // Zoom
    try {
      const zoomFeature = caps.zoomFeature();
      if (zoomFeature && zoomFeature.isSupported()) {
        const min = zoomFeature.min();
        const max = zoomFeature.max();
        const step = zoomFeature.step() || 0.1;
        const current = zoomFeature.value() || min;
        zoomSlider.min = min;
        zoomSlider.max = max;
        zoomSlider.step = step;
        zoomSlider.value = current;
        zoomValue.textContent = current + "x";
        zoomRow.style.display = "flex";
        zoom2xBtn.disabled = max < 2;
      } else {
        zoomRow.style.display = "none";
      }
    } catch (e) {
      zoomRow.style.display = "none";
    }

    // Torch / flash
    try {
      const torchFeature = caps.torchFeature();
      if (torchFeature && torchFeature.isSupported()) {
        torchRow.style.display = "flex";
        torchOn = false;
        torchBtn.textContent = "Flash off";
        torchBtn.classList.remove("on");
      } else {
        torchRow.style.display = "none";
      }
    } catch (e) {
      torchRow.style.display = "none";
    }

    // Manual focus / refocus support (best-effort, varies a lot by device)
    try {
      const rawCaps = html5QrCode.getRunningTrackCapabilities();
      const focusModes = rawCaps && rawCaps.focusMode;
      focusCapable = !!(focusModes && (focusModes.includes("manual") || focusModes.includes("single-shot")));
      if (focusCapable) {
        focusNote.textContent = "Tap the video to refocus.";
      } else {
        focusNote.textContent = "Tap-to-focus isn't supported on this camera — use Zoom to stay farther from the barcode instead.";
      }
    } catch (e) {
      focusCapable = false;
      focusNote.textContent = "Tap-to-focus isn't supported on this camera — use Zoom to stay farther from the barcode instead.";
    }
  }

  async function applyZoom(value) {
    try {
      const caps = html5QrCode.getRunningTrackCameraCapabilities();
      await caps.zoomFeature().apply(value);
      zoomValue.textContent = (Math.round(value * 10) / 10) + "x";
    } catch (e) { /* ignore */ }
  }

  async function toggleTorch() {
    try {
      const caps = html5QrCode.getRunningTrackCameraCapabilities();
      torchOn = !torchOn;
      await caps.torchFeature().apply(torchOn);
      torchBtn.textContent = torchOn ? "Flash on" : "Flash off";
      torchBtn.classList.toggle("on", torchOn);
    } catch (e) {
      setStatus("Couldn't toggle flash on this device", "dup");
    }
  }

  function showFocusRipple(x, y) {
    focusRipple.style.left = x + "px";
    focusRipple.style.top = y + "px";
    focusRipple.classList.remove("pulse");
    // force reflow so the animation can restart
    void focusRipple.offsetWidth;
    focusRipple.classList.add("pulse");
  }

  async function attemptRefocus() {
    if (!scanning || !html5QrCode) return;
    try {
      if (focusCapable) {
        await html5QrCode.applyVideoConstraints({ advanced: [{ focusMode: "single-shot" }] });
      }
    } catch (e) { /* device doesn't support it, ripple is still shown as feedback */ }
  }

  readerWrap.addEventListener("click", (e) => {
    if (!scanning) return;
    const rect = readerWrap.getBoundingClientRect();
    showFocusRipple(e.clientX - rect.left, e.clientY - rect.top);
    attemptRefocus();
  });

  zoomSlider.addEventListener("input", () => applyZoom(parseFloat(zoomSlider.value)));
  zoom2xBtn.addEventListener("click", () => {
    const target = Math.min(2, parseFloat(zoomSlider.max));
    zoomSlider.value = target;
    applyZoom(target);
  });
  torchBtn.addEventListener("click", toggleTorch);

  function formatDateOnly(iso) {
    const d = new Date(iso);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function exportCsv() {
    if (items.length === 0) {
      setStatus("Nothing to export yet", "dup");
      return;
    }
    const header = ["#", "Code", "Label", "Date"];
    const rows = items.slice().reverse().map((it, idx) => [
      idx + 1, it.code, it.label || "", formatDateOnly(it.time)
    ]);
    let csv = header.join(",") + "\n";
    rows.forEach(r => {
      csv += r.map(field => {
        const s = String(field).replace(/"/g, '""');
        return /[",\n]/.test(s) ? `"${s}"` : s;
      }).join(",") + "\n";
    });
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const ts = new Date().toISOString().replace(/[:.]/g, "-");
    a.href = url;
    a.download = `serial_numbers_${ts}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  startBtn.addEventListener("click", startScanning);
  stopBtn.addEventListener("click", stopScanning);
  exportBtn.addEventListener("click", exportCsv);
  clearBtn.addEventListener("click", () => {
    if (items.length && !confirm("Clear all " + items.length + " captured items? This cannot be undone.")) return;
    items = [];
    saveItems();
    render();
    setStatus("List cleared");
  });
  manualAddBtn.addEventListener("click", () => {
    const val = manualInput.value.trim();
    if (!val) return;
    addItem(val, "manual");
    manualInput.value = "";
    manualInput.focus();
  });
  manualInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") manualAddBtn.click();
  });

  loadItems();
  render();
})();
</script>

</body>
</html>
