<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Tracker</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    background:#f5f5f5;
    padding:20px
}
.container{
    max-width:600px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1)
}
h1{text-align:center;margin-bottom:20px;color:#333}
.form-group{margin-bottom:20px}
label{display:block;margin-bottom:5px;font-weight:500;color:#555}
input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:5px;
    font-size:16px
}
input:focus{outline:none;border-color:#4CAF50}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:5px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:10px
}
.btn-scan{background:#2196F3;color:#fff}
.btn-submit{background:#4CAF50;color:#fff}
.btn-export{background:#FF9800;color:#fff}
#video-container{
    display:none;
    background:#000;
    margin:15px 0;
    border-radius:5px;
    overflow:hidden;
    position:relative
}
#video{width:100%}
.scan-line{
    position:absolute;
    width:100%;
    height:2px;
    background:#4CAF50;
    animation:scan 2s linear infinite
}
@keyframes scan{
    0%{top:0}
    50%{top:100%}
    100%{top:0}
}
#zoomControl{display:none;margin:10px 0}
.asset-item{
    background:#f9f9f9;
    padding:15px;
    margin-bottom:10px;
    border-left:4px solid #4CAF50;
    border-radius:5px
}
.asset-item button{
    background:#f44336;
    color:#fff;
    padding:5px 15px;
    margin-top:10px
}
.status{
    padding:10px;
    border-radius:5px;
    margin-bottom:10px;
    display:none
}
.status.success{background:#d4edda;color:#155724;display:block}
.status.error{background:#f8d7da;color:#721c24;display:block}
.status.info{background:#d1ecf1;color:#0c5460;display:block}
</style>
</head>

<body>
<div class="container">
<h1>📦 Asset Tracker</h1>

<div id="status" class="status"></div>

<form id="assetForm">
    <div class="form-group">
        <label>User Name</label>
        <input id="userName" required />
    </div>

    <div class="form-group">
        <label>Device Description</label>
        <input id="deviceDesc" required />
    </div>

    <div class="form-group">
        <label>Serial Number</label>
        <input id="serialNumber" required />
    </div>

    <button type="button" id="scanBtn" class="btn-scan">📷 Scan Barcode / QR</button>

    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <div class="scan-line"></div>
    </div>

    <div id="zoomControl">
        <label>🔍 Zoom</label>
        <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
    </div>

    <button type="submit" class="btn-submit">✅ Add Asset</button>
</form>

<button id="exportBtn" class="btn-export">📥 Export CSV</button>

<div class="asset-list">
<h3>Captured Assets (<span id="assetCount">0</span>)</h3>
<div id="assetsList"></div>
</div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
let assets = JSON.parse(localStorage.getItem('assets')) || [];
let html5QrCode = null;
let scanning = false;
let currentTrack = null;

const scanBtn = document.getElementById('scanBtn');
const serialInput = document.getElementById('serialNumber');
const videoContainer = document.getElementById('video-container');
const zoomControl = document.getElementById('zoomControl');
const zoomSlider = document.getElementById('zoomSlider');
const assetsList = document.getElementById('assetsList');
const status = document.getElementById('status');

displayAssets();
checkCameraSupport();

async function checkCameraSupport(){
    try{
        await navigator.mediaDevices.getUserMedia({video:true});
        showStatus('Camera ready (rear camera)', 'info');
        setTimeout(()=>status.style.display='none',3000);
    }catch{
        showStatus('Camera not available', 'error');
        scanBtn.disabled=true;
    }
}

scanBtn.onclick = ()=> scanning ? stopScanning() : startScanning();

async function startScanning(){
    scanning=true;
    scanBtn.textContent='⏹ Stop Scanning';
    videoContainer.style.display='block';

    html5QrCode = new Html5Qrcode("video-container");

    const config={
        fps:10,
        qrbox:{width:250,height:250},
        formatsToSupport:Object.values(Html5QrcodeSupportedFormats)
    };

    try{
        await html5QrCode.start(
            { facingMode:{ exact:"environment" } },
            config,
            onScanSuccess
        );
    }catch{
        await html5QrCode.start(
            { facingMode:"environment" },
            config,
            onScanSuccess
        );
    }

    currentTrack = html5QrCode.getRunningTrack();
    if(currentTrack?.getCapabilities()?.zoom){
        const z=currentTrack.getCapabilities().zoom;
        zoomSlider.min=z.min;
        zoomSlider.max=z.max;
        zoomSlider.step=z.step||0.1;
        zoomControl.style.display='block';
    }
}

function onScanSuccess(text){
    serialInput.value=text;
    showStatus(`✅ Scanned: ${text}`, 'success');
    navigator.vibrate?.(200);
    stopScanning();
}

async function stopScanning(){
    if(html5QrCode){
        await html5QrCode.stop();
        html5QrCode.clear();
    }
    scanning=false;
    scanBtn.textContent='📷 Scan Barcode / QR';
    videoContainer.style.display='none';
    zoomControl.style.display='none';
    currentTrack=null;
}

zoomSlider.oninput=()=>{
    currentTrack?.applyConstraints({advanced:[{zoom:zoomSlider.value}]});
};

document.getElementById('assetForm').onsubmit=e=>{
    e.preventDefault();
    assets.push({
        id:Date.now(),
        user:userName.value,
        device:deviceDesc.value,
        serial:serialInput.value,
        date:new Date().toLocaleString()
    });
    localStorage.setItem('assets',JSON.stringify(assets));
    e.target.reset();
    displayAssets();
    showStatus('Asset added','success');
};

function displayAssets(){
    assetCount.textContent=assets.length;
    assetsList.innerHTML=assets.map(a=>`
        <div class="asset-item">
            <strong>${a.user}</strong><br>
            ${a.device}<br>
            🔢 ${a.serial}<br>
            📅 ${a.date}
        </div>
    `).reverse().join('');
}

exportBtn.onclick=()=>{
    if(!assets.length)return showStatus('No assets','error');
    const csv=[
        ['User','Device','Serial','Date'],
        ...assets.map(a=>[a.user,a.device,a.serial,a.date])
    ].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const b=new Blob([csv],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='assets.csv';
    a.click();
};

function showStatus(msg,type){
    status.textContent=msg;
    status.className=`status ${type}`;
}
</script>
</body>
</html>
